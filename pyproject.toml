[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ida-auto-mcp"
version = "1.0.0"
description = "Autonomous process and batch orchestrator for IDA Pro MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]

[project.scripts]
ida-auto-mcp = "server:main"
